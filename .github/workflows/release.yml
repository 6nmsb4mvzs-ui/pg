# Publishes every client version as a GitHub release. Bump the version in
# Info.plist, push to main, and the release (with the zip the client's updater
# downloads) appears by itself. Versions that already have a release are skipped.
name: Release

on:
  push:
    branches: [main]
    paths: ["PG3D Mac Client.app/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          v=$(grep -A1 'CFBundleShortVersionString' "PG3D Mac Client.app/Contents/Info.plist" | grep -o '[0-9][0-9.]*' | head -1)
          [ -n "$v" ] || { echo "No version in Info.plist"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V is already released."; exit 0
          fi
          zip="PG3D_Mac_Client_v$V.zip"
          # git archive keeps the launcher's executable bits.
          git archive --format=zip -o "$zip" HEAD "PG3D Mac Client.app"
          # The FPS unlocker, mouse fix and launcher are prebuilt binaries; never ship without them.
          for f in PG3DFPSUnlock.dylib PG3DMouseFix.dylib launch-game; do
            unzip -l "$zip" | grep -q "fps_unlocker/build/$f" || { echo "Missing fps_unlocker/build/$f"; exit 1; }
          done
          # The app's main executable is the native launcher (universal Mach-O), not a script.
          [ "$(head -c 4 "PG3D Mac Client.app/Contents/MacOS/PG3DMacClient" | od -An -tx1 | tr -d ' ')" = "cafebabe" ] \
            || { echo "Contents/MacOS/PG3DMacClient is not the built launcher"; exit 1; }
          notes=$(awk -v hdr="New in ${V%.0}" '$0==hdr{f=1;next} f&&/^New in /{exit} f' "PG3D Mac Client.app/Contents/Resources/README.txt")
          gh release create "v$V" "$zip" --title "PG3D Mac Client $V" --notes "${notes:-Version $V}"
